<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Island map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

  
<style>

.leaflet-container {
  background: transparent;
}
/* NOTE FOR ANY AI ASSISTANT / FUTURE EDITS: PlayfairDisplay-Bold.ttf supports ONLY the characters A-Z and 0-9. It is limited with unicode-range in the @font-face below. All other characters must come from the fallback fonts in the font-family stack (Helvetica Neue, Arial, sans-serif). Do not assume the custom font has lowercase letters, punctuation or symbols. There is intentionally no font-loading JavaScript. */
@font-face {
  font-family: 'PlayfairDisplay';
  src: url('PlayfairDisplay-Bold.ttf') format('truetype');
  font-weight: 700;
  unicode-range: U+0030-0039, U+0041-005A; /* 0-9 and A-Z only */
}

:root { --bg: rgb(227, 201, 152); --fg: rgb(59, 38, 20); --fab: clamp(48px, 6vmin, 64px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: rgb(25, 25, 25); --fg: #fff; } }
:root[data-theme="dark"] { --bg: rgb(25, 25, 25); --fg: #fff; }
@media (pointer: coarse) { :root { --fab: clamp(52px, 13vmin, 68px); } }
:root { --sfg: rgb(62,44,42); --inv: 0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sfg: #fff; --inv: 1; } }
:root[data-theme="dark"] { --sfg: #fff; --inv: 1; }

html, body { width: 100%; height: 100%; margin: 0; font-family: 'PlayfairDisplay', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
#map { width: 100%; height: 100vh; height: 100dvh; }
.drawing path.leaflet-interactive { pointer-events: none; }
.leaflet-editing-icon { width: 10px !important; height: 10px !important; margin: -5px 0 0 -5px !important; }
.leaflet-tooltip { font-family: inherit; }
/* Leaflet buttons: zoom (+ and -) and the draw/edit toolbar. They follow the same colors as the panel (--bg and --fg). */
.leaflet-bar { border: 1px solid var(--fg); box-shadow: none; }
.leaflet-bar a,
.leaflet-bar a:hover,
.leaflet-bar a:focus { background-color: var(--bg); color: var(--fg); border-bottom-color: var(--fg); }
.leaflet-bar a:hover { filter: brightness(1.15); }
.leaflet-bar a.leaflet-disabled { background-color: var(--bg); color: var(--fg); opacity: .5; }

/* Small action buttons that appear while drawing (Finish, Delete last point, Cancel, Save) */
.leaflet-draw-actions a,
.leaflet-draw-actions a:hover { background-color: var(--bg); color: var(--fg); border-color: var(--fg); }

.leaflet-tooltip {
  font-family: inherit;
  width: max-content !important;
  max-width: min(320px, 70vw);
  white-space: normal;
  padding: 8px 10px;
  line-height: 1.35;
}
.leaflet-tooltip .tip-line {
  display: block;
  margin: 0 0 6px 0;
}
.leaflet-tooltip .tip-line:last-child {
  margin-bottom: 0;
}
.leaflet-tooltip .tip-label {
  opacity: 0.75;
  margin-right: 0.35em;
}

/* The draw/edit icons are black images, so in dark mode they get inverted to white. The background is set to the opposite color so it ends up as dark. */
:root[data-theme="dark"] .leaflet-draw-toolbar > a { filter: invert(1); background-color: rgb(230, 230, 230); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .leaflet-draw-toolbar > a { filter: invert(1); background-color: rgb(230, 230, 230); }
}

#panel, #sideList {
  position: fixed; z-index: 1000; box-sizing: border-box;
  background: var(--bg); color: var(--fg); border-radius: 6px; font-size: 14px;
}
#panel { top: 10px; right: 64px; width: min(270px, calc(100vw - 74px)); max-height: 60dvh; overflow: auto; padding: 10px; }
#panelHeader { margin: -10px -10px 8px; padding: 8px 10px; border-bottom: 1px solid var(--fg); cursor: move; touch-action: none; user-select: none; display: flex; justify-content: space-between; align-items: center; }
#panel.collapsed #panelBody { display: none; }
#panel label { display: block; margin-bottom: 8px; }
#panel input[type=text] { box-sizing: border-box; width: 100%; margin-top: 3px; font-size: 16px; }
#panel input[type=file] { width: 100%; margin-top: 3px; }
#panel button { margin: 3px 3px 3px 0; }
#status, #debugBody { margin-top: 6px; font-size: 13px; }

/* Left list: full height, square corners, opens top to bottom like unrolling a document. Outline = text color. */
/* Transparency: 90% opaque = 10% see-through. Use 80% to 95% for 0.2 to 0.05 transparency. */
#sideList {
  left: 0; top: 0; bottom: 0; height: 100dvh; max-height: none; border-radius: 0;
  width: clamp(150px, 22vw, 260px); overflow-y: auto; padding: 8px 8px calc(var(--fab) + 50px);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  border: 1px solid var(--fg);
  clip-path: inset(0 0 100% 0); visibility: hidden;
  transition: clip-path .4s ease, visibility 0s linear .4s;
}
#sideList.open { clip-path: inset(0); visibility: visible; transition: clip-path .4s ease, visibility 0s; }
@media (pointer: coarse) { #sideList { width: clamp(140px, 40vw, 220px); } }
/* Icon fills ~90% of the list width and scales with it */
.list-icon { display: block; width: 90%; height: auto; margin: 4px auto 10px; }
.list-btn { display: block; box-sizing: border-box; width: 100%; margin-bottom: 8px; padding: 10px; background: var(--bg); color: var(--fg); border: 1px solid var(--fg); border-radius: 6px; text-align: center; text-decoration: none; text-transform: uppercase; }

.round-btn {
  position: fixed; z-index: 1000; display: flex; align-items: center; justify-content: center;
  width: var(--fab); height: var(--fab); border-radius: 50%; color: #fff; text-decoration: none; border: 0; cursor: pointer;
  font-size: calc(var(--fab) * 0.45); box-shadow: 0 2px 8px rgba(0,0,0,.35); transition: transform .15s;
}
.round-btn:hover { transform: scale(1.08); }
#listToggle { left: 14px; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); background: var(--bg); color: var(--fg); border: 1px solid var(--fg); }
.black-icon { filter: brightness(0) invert(var(--inv)); }
#searchFrame input { box-sizing: border-box; width: 100%; margin: 4px 0; padding: 6px; font: inherit; font-size: 16px; background: var(--bg); color: var(--sfg); border: 1px solid var(--fg); border-radius: 4px; }
.srow { display: flex; gap: 6px; align-items: center; }
.srow input { flex: 1; min-width: 0; }
#sZoom { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--bg); border: 1px solid var(--fg); cursor: pointer; }
.slist { display: none; max-height: 28dvh; overflow-y: auto; border: 1px solid var(--fg); }
.slist.open { display: block; }
.sitem { position: relative; display: block; width: 100%; padding: 6px 8px; text-align: center; font: inherit; background: var(--bg); color: var(--sfg); border: 0; border-bottom: 1px solid var(--fg); cursor: pointer; }
.sitem.missing { color: #c62828; }      /* red = in sheet, not on map */
.sitem.duplicate { color: #ef6c00; }    /* orange = several sheet rows → same name */
.sitem.missing.duplicate { color: #ef6c00; } /* orange wins if both */
.sitem.hasflag { padding-left: 48px; }
.sitem img.flag { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 30px; height: auto; max-height: 80%; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--bg); color: var(--sfg); border-radius: 0; }
a.owner-link { color: var(--sfg); text-decoration: underline; text-decoration-color: var(--sfg); }


.dc-row { display: flex; justify-content: space-between; gap: 14px; align-items: center; }


.dc-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.dc-dot.on { background: rgb(35, 165, 90); }
.dc-dot.off { background: rgb(128, 132, 142); }
:root { --dc-splash-opacity: .15; --dc-icon-opacity: .4; }

.live-title { margin: 12px 0 4px; font-weight: 700; border-bottom: 1px solid var(--fg); }
.live-item { display: block; margin-bottom: 8px; padding: 6px; font-size: 13px; color: var(--fg); text-decoration: none; border: 1px solid var(--fg); }
.live-head { font-weight: 700; }
.map-flag { object-fit: contain; }
#themeBtn { left: calc(24px + var(--fab)); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); background: var(--bg); color: var(--fg); border: 1px solid var(--fg); }
#loadError { position: fixed; z-index: 1000; left: 50%; top: 10px; transform: translateX(-50%); width: min(420px, calc(100vw - 40px)); box-sizing: border-box; padding: 10px 14px; text-align: center; background: var(--bg); color: var(--fg); border: 1px solid var(--fg); border-radius: 6px; font-size: 14px; }

/* ===== Bottom-right buttons, top to bottom: Search, Discord, VRChat, Settings ===== */
.fab-col { position: fixed; z-index: 1000; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.fab-col .round-btn { position: relative; background: var(--bg); color: var(--fg); border: 1px solid var(--fg); }
/* Icons are recolored to the text color (brown in light mode, white in dark mode) from the white image files */
.ico { display: flex; align-items: center; justify-content: center; width: 55%; height: 55%; }
.ico.has-img { background-color: var(--fg); -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; }
#dcWrap { position: relative; }
#fabDiscord { position: relative; z-index: 2; }
#fabDiscord .dc-server { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; opacity: 0; transition: opacity .2s; }
#fabDiscord .ico { position: relative; z-index: 1; transition: opacity .2s; }
#dcWrap:hover .dc-logo { opacity: .35; }
#dcWrap:hover .dc-server.ready { opacity: var(--dc-icon-opacity); }
/* The grey tab sits BEHIND the button (z-index 1 vs 2) */
#dcInfo { position: absolute; right: 50%; top: 0; bottom: 0; z-index: 1; width: 0; overflow: hidden; white-space: nowrap; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; background: rgb(70, 70, 70); color: #fff; border-radius: calc(var(--fab) / 2) 0 0 calc(var(--fab) / 2); font-size: clamp(11px, calc(var(--fab) * 0.26), 14px); line-height: 1.3; transition: width .25s ease; }
#dcInfo[hidden] { display: none; }
#dcInfo > div { padding: 0 calc(var(--fab) / 2 + 6px) 0 14px; text-align: right; position: relative; z-index: 1; }
#dcInfo .dc-title { font-weight: 700; }
#dcWrap:hover #dcInfo { width: 230px; }
#dcBg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: var(--dc-splash-opacity); }
/* Search and settings frames, animated. On mouse devices they sit further left so the Discord tab never overlaps them. */
#searchFrame, #settingsFrame { position: fixed; z-index: 1000; box-sizing: border-box; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); right: calc(28px + var(--fab)); width: min(300px, calc(100vw - var(--fab) - 40px)); max-height: 70dvh; overflow-y: auto; padding: 8px; background: var(--bg); color: var(--sfg); border: 1px solid var(--fg); border-radius: 6px; opacity: 0; visibility: hidden; transform: translateY(14px) scale(.97); transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s; }
#searchFrame.open, #settingsFrame.open { opacity: 1; visibility: visible; transform: none; transition: opacity .2s ease, transform .2s ease, visibility 0s; }
@media (hover: hover) { #searchFrame, #settingsFrame { right: calc(14px + var(--fab) / 2 + 246px); width: max(180px, min(300px, calc(100vw - var(--fab) / 2 - 280px))); } }
#settingsFrame label { display: block; margin: 8px 0; }
#settingsFrame input[type=range] { width: 100%; }
.map-label div { transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none; font-family: inherit; font-size: 12px; color: #fff; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 3px #000; }
body { background: var(--bg); }
#sZoom { color: var(--sfg); }
</style>
</head>
<body>
<div id="map"></div>

<div id="sideList">
 
  <img class="list-icon" src="VRCTitle.PNG" alt="">
  <div id="listButtons"></div>
  <div id="listLive"></div>
</div>
<button id="listToggle" class="round-btn" type="button" aria-label="Show or hide list">☰</button>

<button id="themeBtn" class="round-btn" type="button" aria-label="Light or dark mode">◐</button>
<div id="loadError" hidden>The island data (islandslist.tsv) could not be loaded. Please contact the website owner, Daniel.</div>

<!-- NOTE: the icons are set with the ICONS list at the top of the script (URLs of your white images). The emoji below show until then. -->
<div class="fab-col">
  <button id="searchBtn" class="round-btn" type="button" aria-label="Search"><span class="ico" data-icon="search">🔍</span></button>
  <div id="dcWrap">
    <div id="dcInfo" hidden>
      <span id="dcBg"></span>
      <div class="dc-title" id="dcName"></div>
      <div class="dc-row">
        <span><span class="dc-dot off"></span><span id="dcOff"></span></span>
        <span><span class="dc-dot on"></span><span id="dcOn"></span></span>
      </div>
    </div>
    <a id="fabDiscord" class="round-btn" href="https://discord.gg/bpj4Gu4MX" target="_blank" rel="noopener" aria-label="Discord"><img id="dcIcon" class="dc-server" alt=""><span class="ico dc-logo" data-icon="discord">🔗</span></a>
  </div>
  <a id="fabVrc" class="round-btn" href="https://vrchat.com/home/group/grp_677be38a-564d-432f-be95-f2e319bb4b13" target="_blank" rel="noopener" aria-label="VRChat"><span class="ico" data-icon="vrchat">🌐</span></a>
  <button id="settingsBtn" class="round-btn" type="button" aria-label="Settings"><span class="ico" data-icon="settings">⚙</span></button>
</div>
<div id="searchFrame">
  <div class="srow">
    <input id="sIsland" type="text" placeholder="Search islands" autocomplete="off">
    <button id="sZoom" type="button" aria-label="Zoom to island"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/></svg></button>
  </div>
  <div class="slist" id="lIsland"></div>
  <input id="sOrg" type="text" placeholder="Search groups / crews" autocomplete="off">
  <div class="slist" id="lOrg"></div>
  <input id="sOwner" type="text" placeholder="Search island owners" autocomplete="off">
  <div class="slist" id="lOwner"></div>
</div>
<div id="settingsFrame">
  <label><input type="checkbox" id="optColors"> Island colors</label>
  <label><input type="checkbox" id="optFlags" checked> Flags on the map</label>
  <label><input type="checkbox" id="optNames" checked> Island names on the map</label>
  <label><input type="checkbox" id="optHideUnnamed"> Hide Unnamed Islands</label>
  <label><input type="checkbox" id="optHideUnowned"> Hide unowned islands</label>
  <label>Fill opacity: <span id="optOpacityVal"></span><input type="range" id="optOpacity" min="0" max="1" step="0.05"></label>
</div>

<script>
// ===== CONFIG: change these if the header words in your Google Sheets change (case ignored) =====
const CONFIG = {
  islandHeaders: ['Location', 'Island / Location', 'Island'],      // TSV #2 first column
  ownerHeaders:  ['Owner(s)', 'Owner', 'Controller', 'Status'],    // TSV #2 second column (all header words used)
  statusHeaders: ['Status'],                                       // sections with these headers are NOT owners (e.g. Special Zone)                        // TSV #2 second column
  nationHeaders: ['Crews/Groups', 'Nations', 'Nation'],            // TSV #3 first column
  leaderHeaders: ['Owner(s)', 'Owner', 'Leaders(s)', 'Leader(s)', 'Leaders', 'Leader'], // TSV #3 second column
  colorHeaders:  ['Team Color', 'Team Colour'],                    // TSV #3 optional extra column
  flagHeaders:   ['Flag', 'Flag URL'],                             // TSV #3 optional: flag image path/URL for the group
  linkHeaders:   ['Website', 'Link', 'More Info']                  // TSV #3 optional: link for the leader's name                    // TSV #3 optional extra column
};
// Left-list buttons. Empty = none shown. Example: { label: 'Rules', url: 'https://example.com' }
const LIST_BUTTONS = [
  { label: 'Island Tracker List (VRGoofy)', url: 'https://docs.google.com/spreadsheets/d/14I31HO_9qbplW8LWP63-itFL1eAjL0O-ecEAxxCOJpM/' },
  { label: 'Crew Tracker List (Dave)', url: 'https://docs.google.com/spreadsheets/d/1IcCHc-ERXwUGyJmyDChw5MXwShDeGDNqkCr7fIafoDk/' }
];
const imageUrl = 'TargetedMap.PNG';
// URLs of your white icon images (for example the files you upload to GitHub). Empty = the emoji shows instead.
const ICONS = { search: '', discord: 'DiscordIcon.PNG', vrchat: 'VRCIcon.PNG', settings: '' };

// VRChat world pages for islands/ships. Keys are polygon names in lowercase.
const VRC_WORLDS = {
  'thousand sunny #1': 'https://vrchat.com/home/world/wrld_f37dfa48-f423-448a-87b4-fe48d70bbd00/info',
  'thousand sunny #2': 'https://vrchat.com/home/world/wrld_9c38430b-677c-4497-b139-3680bd03bc79/info',
  'baratie': 'https://vrchat.com/home/world/wrld_41dd60d4-d5c1-4100-afe5-1501f943e62c/info',
  'onigashima': 'https://vrchat.com/home/world/wrld_ff90edd9-c6bd-4b8e-9566-0905365a32fa/info'
};
// Settings defaults. Flags are skipped automatically on data saver, 2G or low-memory devices (where the browser reports it).
const conn = navigator.connection || {};
const lowResources = !!(conn.saveData || /2g/.test(conn.effectiveType || '') || (navigator.deviceMemory && navigator.deviceMemory <= 2));
const OPT = { colors: false, flags: !lowResources, names: true, hideUnnamed: false, hideUnowned: false };
// Paste Google Sheets links here (see the steps above). Leave '' to skip one.
const SHEETS = { worlds: '', announcements: '', events: '',
  owners: 'https://docs.google.com/spreadsheets/d/14I31HO_9qbplW8LWP63-itFL1eAjL0O-ecEAxxCOJpM/',
  nations: 'https://docs.google.com/spreadsheets/d/1IcCHc-ERXwUGyJmyDChw5MXwShDeGDNqkCr7fIafoDk/' };
  // Island colors. Keys are the group name in lowercase with no spaces/symbols and no leading "the".
const GROUP_COLORS = {
  marines: 'rgb(0, 90, 255)',
  worldgovernment: 'rgb(0, 90, 255)',
  revolutionaryarmy: 'rgb(180, 0, 0)'
};
const DEFAULT_GROUP_COLOR = 'rgb(0, 0, 0)';      // known crew with no Team Color in the sheet
const NO_OWNER_COLOR = 'rgb(0, 146, 70)';        // no owner at all (green)
const OWNED_NO_CREW_COLOR = 'rgb(128, 0, 128)'; // has owner, but no crew/group in the crew sheet (purple)
// Polygon fill transparency: 0 = invisible fill, 1 = fully solid. Change this number to adjust all polygons.
let POLYGON_FILL_OPACITY = 0.5; // solid color / stripe fill opacity

const $ = (id) => document.getElementById(id);
const setStatus = (t) => console.log(t); // no status panel in the public page
// ===== UI: theme, list, debug =====
$('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});
$('listToggle').addEventListener('click', () => $('sideList').classList.toggle('open'));
LIST_BUTTONS.forEach((b) => {
  const a = document.createElement('a');
  a.className = 'list-btn'; a.textContent = b.label; a.href = b.url; a.target = '_blank'; a.rel = 'noopener';
  $('listButtons').appendChild(a);
});

// ===== Map =====
const map = L.map('map', { crs: L.CRS.Simple, maxZoom: 4, minZoom: -5 });
map.setView([0, 0], 0);
map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
map.zoomControl.setPosition('topright');
// Dots and lines: draw, clear one (trash button), or clear all. Not saved; they disappear on reload.
const userMarks = new L.FeatureGroup().addTo(map);
map.addControl(new L.Control.Draw({
  position: 'topright',
  draw: { polyline: { shapeOptions: { color: '#ff3b30', weight: 3 } }, circlemarker: { color: '#ff3b30', fillColor: '#ff3b30', fillOpacity: 1, radius: 5 }, polygon: false, rectangle: false, circle: false, marker: false },
  edit: { featureGroup: userMarks, edit: false }
}));
map.on(L.Draw.Event.CREATED, (e) => userMarks.addLayer(e.layer));
map.on(L.Draw.Event.DRAWSTART, () => map.getContainer().classList.add('drawing'));
map.on(L.Draw.Event.DRAWSTOP, () => map.getContainer().classList.remove('drawing'));
const drawnItems = new L.FeatureGroup().addTo(map);
// ===== Globe-style wrapping: polygons are also drawn as read-only copies one map width left/right =====
const ghostItems = new L.FeatureGroup().addTo(map);
let mapWidth = 0;          // image width, set when the map image loads
const WRAP_COPIES = 3;     // copies on each side
const eachShape = (fn) => { drawnItems.eachLayer(fn); ghostItems.eachLayer(fn); };
const shiftLL = (ll, dx) => Array.isArray(ll) ? ll.map((x) => shiftLL(x, dx)) : L.latLng(ll.lat, ll.lng + dx);
const shiftCoords = (c, dx) => typeof c[0] === 'number' ? [c[0] + dx, c[1]] : c.map((x) => shiftCoords(x, dx));
function setLayerStyle(layer, style) { layer.setStyle(style); (layer._ghosts || []).forEach((g) => g.setStyle(style)); applyFlagFill(layer); }
function makeGhosts(layer) {
  layer._ghosts = [];
  if (!mapWidth) return;
  for (let k = -WRAP_COPIES; k <= WRAP_COPIES; k++) {
    if (!k) continue;
    const g = L.polygon(shiftLL(layer.getLatLngs(), k * mapWidth), layer.options);
    g.bindTooltip(() => tipContent(layer), { sticky: true });
    wireClick(g, layer);
    ghostItems.addLayer(g);
    layer._ghosts.push(g);
  }
  applyFlagFill(layer);
  applyHidden(layer);
}

// Move any polygon that sits on a repeated copy (far left/right) back onto the main map
function normalizeToMainMap() {
  if (!mapWidth) return;
  drawnItems.eachLayer((l) => {
    const k = Math.floor(l.getBounds().getCenter().lng / mapWidth);
    if (k) l.setLatLngs(shiftLL(l.getLatLngs(), -k * mapWidth));
  });
}
function rebuildGhosts() { normalizeToMainMap(); ghostItems.clearLayers(); drawnItems.eachLayer(makeGhosts); rebuildFlags(); }

// ===== Flags in the middle of each island (a flag only shows if its image file exists) =====
const flagItems = new L.FeatureGroup().addTo(map);
const flagCache = new Map();
let flagRun = 0;
function flagReady(url, cb) {
  if (flagCache.has(url)) { if (flagCache.get(url)) cb(); return; }
  const t = new Image();

function parseSheet(text, aHeads, bHeads) {
  const rows = text.replace(/^\uFEFF/, '').split(/\r?\n/)
    .map((l) => l.split('\t').map((c) => c.trim())).filter((r) => r[0] || r[1]);
  const a = aHeads.map((s) => s.toLowerCase()), b = bHeads.map((s) => s.toLowerCase());
  const isHead = (r) => a.includes(r[0].toLowerCase()) && b.includes((r[1] || '').toLowerCase());
  const out = [];
  let head = null, lastA = '';
  rows.forEach((r, i) => {
    if (isHead(r)) { head = r.map((h) => h.toLowerCase()); lastA = ''; return; }
    if (!head) return;
    if (rows[i + 1] && isHead(rows[i + 1])) return; // section title row
    if (!r[0]) r[0] = lastA;                        // blank first cell = same entry as the row above
    if (!r[0]) return;
    lastA = r[0];
    const cols = {};
    head.forEach((h, k) => { cols[h] = r[k] || ''; });
    out.push({ a: r[0], b: r[1] || '', h2: head[1], cols, cells: r });
  });
  return out;
}

function normColor(c) {
  c = (c || '').trim();

  if (/^[0-9a-f]{6}$/i.test(c)) return '#' + c;

}

function imgUrl(u) {
  u = String(u || '').trim();

  // full GitHub blob page → direct raw file
  const m = u.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/i);
  if (m) return `https://github.com/${m[1]}/${m[2]}/raw/${m[3]}/${m[4]}`;

  const r = u.match(/^\/?blob\/[^/]+\/(.+)$/i);

  return u;                    // already a usable URL
}

// All distinct group colors for an island (for multi-crew stripes)
function groupColorsOf(raw) {
  const owners = ownersOf(raw);
  if (!owners.length) return [];

  const colors = [];

  for (const o of owners) {

const stripePatterns = new Map();
function stripePattern(colors) {
  if (colors.length <= 1) return null;

  if (stripePatterns.has(key)) return stripePatterns.get(key);

  if (!layers.length) return null;

  const id = 'stripe-' + stripePatterns.size;
  const n = colors.length;
  const pat = document.createElementNS(NS, 'pattern');
  pat.setAttribute('id', id);
  pat.setAttribute('patternUnits', 'objectBoundingBox');
  pat.setAttribute('width', '1');

    // Strip trailing " (anything)" — e.g. "Conomi Islands (Arlong Park)" → "Conomi Islands"
  // Also handles nested/odd spacing: "Name (note)", "Name（note）"
  const stripped = name.replace(/\s*[(\uFF08][^)\uFF09]*[)\uFF09]\s*$/u, '').trim();
  if (stripped && stripped.toLowerCase() !== low) {
    // Prefer whatever exists on the map (with or without "Island", etc.)
    const hit = onMap(idx, stripped)
      || onMap(idx, `${stripped} Island`)
      || onMap(idx, stripped.replace(/\s+Island$/i, ''));
    if (hit) return hit;
    // Not on map yet — still use the cleaned name for the red "missing" list
    name = stripped;
  }

  // 2) "G-5 Base" / "G-12 Base" → "G-5" / "G-12"
  let m = name.match(/^G\s*[-–]?\s*(\d+)\s+Base$/i);
  if (m) {
    const cand = `G-${m[1]}`;
    return onMap(idx, cand) || cand;
  }

  // 3) "80th Branch" / "1st Branch" → "G-80" / "G-1"
  m = name.match(/^(\d+)(?:st|nd|rd|th)\s+Branch$/i);
  if (m) {
    const cand = `G-${m[1]}`;
    return onMap(idx, cand) || cand;
  }

  // 4) "Name Island" ↔ "Name" depending on what exists on the map
  m = name.match(/^(.+?)\s+Island$/i);
  if (m) {
    const base = m[1].trim();
    const withIsland = onMap(idx, `${base} Island`);
    const without = onMap(idx, base);
    if (withIsland) return withIsland;       // map has "Foodvalten Island"
    if (without) return without;             // map has "Foodvalten" only
    // neither on map — prefer short form as display
    return base;
  } else {
    // Sheet says "Foodvalten" but map has "Foodvalten Island"
    const withIsland = onMap(idx, `${name} Island`);
    const exact = onMap(idx, name);
    if (exact) return exact;
    if (withIsland) return withIsland;
  }

  // 5) Case-insensitive exact match to a map polygon
  const exact = onMap(idx, name);
  if (exact) return exact;

  return name; // unknown — keep sheet spelling for the red "missing" list
}
const norm = (s) => String(s || '').toLowerCase().replace(/^the\s+/, '').replace(/[^a-z0-9]/g, '');
// Shared owners are split on these (change here if needed): "/"  ","  "&"  and the word "and"
const OWNER_SPLIT = /\s*(?:\/|,|&|\band\b)\s*/i;
const ownersOf = (raw) => String(raw || '').split(OWNER_SPLIT).map((s) => s.trim()).filter(Boolean);
function aliasOf(raw) {
  const k = norm(raw);
  for (const canon of Object.keys(OWNER_ALIASES)) {
    if (norm(canon) === k || OWNER_ALIASES[canon].some((a) => norm(a) === k)) return canon;
  }
  return null;
}
const ownerKey = (raw) => { const a = aliasOf(raw); return a ? norm(a) : norm(raw); };
function nationsOf(raw) {
  const exact = leaderMap.get(raw.toLowerCase());
  if (exact) return exact;
  const k = ownerKey(raw);
  for (const [leader, nations] of leaderMap) if (ownerKey(leader) === k) return nations;
  return [];
}

function wireClick(target, layer) {
  target.on('click', (e) => {
    if (map.getContainer().classList.contains('drawing')) return;
    const p = layer.feature.properties, raw = resolveOwner(p);
    const box = document.createElement('div');
    const add = (href, text) => {
      if (!/^https?:\/\//i.test(href || '')) return;
      const a = document.createElement('a');
      a.href = href; a.target = '_blank'; a.rel = 'noopener'; a.className = 'owner-link'; a.style.display = 'block'; a.textContent = text;
      box.appendChild(a);
    };
    add(linkOf(raw), ownerLabel(raw));
    const w = worldOf(p.name);
    if (w) add(w.link, 'Open world in VRChat');
    if (box.childNodes.length) L.popup().setLatLng(e.latlng).setContent(box).openOn(map);
  });
}

function collect() {
  const islands = [], orgs = new Map(), owners = new Map();
  const onMapKeys = new Set();

  drawnItems.eachLayer((l) => {
    const p = l.feature && l.feature.properties;
    if (!p) return;
    const label = String(p.name);
    onMapKeys.add(label.toLowerCase());
    islands.push({
      label,
      layers: [l],
      missing: false,
      duplicate: false,
      unnamed: label.includes('???')
    });
    ownersOf(resolveOwner(p)).forEach((raw) => {
      const key = ownerKey(raw);
      if (!owners.has(key)) owners.set(key, { label: aliasOf(raw) || raw, layers: new Set() });
      const o = owners.get(key);
      o.layers.add(l);
      if (!aliasOf(raw) && raw.length > o.label.length) o.label = raw;
      groupsOf(raw).forEach((n) => {
        const k = n.toLowerCase();
        if (!orgs.has(k)) orgs.set(k, { label: n, flag: flagFor(n), layers: new Set() });
        orgs.get(k).layers.add(l);
      });
    });
  });

  // Sheet islands not on the map → red; rename collisions → orange
  const dupKeys = window.__islandDupKeys || new Set();
  if (typeof ownerIslandLabels !== 'undefined' && ownerIslandLabels) {
    ownerIslandLabels.forEach((label, k) => {
      if (onMapKeys.has(k)) {
        if (dupKeys.has(k)) {
          const item = islands.find((i) => i.label.toLowerCase() === k);
          if (item) item.duplicate = true;
        }
        return;
      }
      islands.push({
        label,
        layers: [],
        missing: true,
        duplicate: dupKeys.has(k),
        unnamed: false
      });
    });
  }

  // Crews from the crew sheet even if they own nothing
  leaderMap.forEach((crews) => crews.forEach((n) => {
    const k = n.toLowerCase();
    if (!orgs.has(k)) orgs.set(k, { label: n, flag: flagFor(n), layers: new Set() });
  }));

  // Red for org/owner entries with no polygons on the map
  const list = (m) => [...m.values()].map((o) => ({
    label: o.label,
    flag: o.flag,
    layers: [...o.layers],
    missing: o.layers.size === 0
  }));

  return { islands, orgs: list(orgs), owners: list(owners) };
}

  // How many *original sheet rows* collapsed onto each final name?
  // (recompute quickly from ownerIslandLabels — duplicates = same final key from different sheet names)
  // We mark duplicate when the joined owner string had multiple contributions:
  // simpler: any final name that appears more than once in the raw rename pass is stored below.
  // Use a side map filled in loadOwners:
  const dupKeys = window.__islandDupKeys || new Set();

  ownerIslandLabels.forEach((label, k) => {
    if (onMapKeys.has(k)) {
      // already on map — mark duplicate if several sheet rows mapped here
      if (dupKeys.has(k)) {
        const item = islands.find((i) => i.label.toLowerCase() === k);
        if (item) item.duplicate = true;
      }
      return;
    }
    islands.push({
      label,
      layers: [],
      missing: true,
      duplicate: dupKeys.has(k),
      unnamed: false
    });
  });

let searchAF = 0, pickedIsland = null;
function flashLayers(layers) {
  cancelAnimationFrame(searchAF);
  restyleAll();
  const t0 = performance.now();
  const step = (now) => {
    const t = Math.min((now - t0) / 1000, 1);
    layers.forEach((l) => setLayerStyle(l, { fillOpacity: 1 + (POLYGON_FILL_OPACITY - 1) * t }));
    if (t < 1) searchAF = requestAnimationFrame(step);
  };
  searchAF = requestAnimationFrame(step);
}
function showLayers(layers) {
  if (!layers.length) return;
  map.flyToBounds(L.latLngBounds(layers.map((l) => l.getBounds())), { duration: 1 });
  flashLayers(layers);
}
function fillList(listEl, items, filter, onPick) {
  const q = filter.trim().toLowerCase();
  listEl.textContent = '';

  // 0 = normal A–Z, 1 = digits / non-letter start, 2 = missing (not on map), 3 = ??? unnamed
  const sortBucket = (i) => {
    if (i.unnamed || String(i.label).includes('???')) return 3;
    if (i.missing) return 2;
    const s = String(i.label || '').trim();
    if (!/^[A-Za-z]/.test(s) || /\d/.test(s)) return 1;
    return 0;
  };

  items.filter((i) => i.label.toLowerCase().includes(q))
    .sort((a, b) => {
      const d = sortBucket(a) - sortBucket(b);
      if (d) return d;
      return a.label.localeCompare(b.label, undefined, { numeric: true });
    })
    .forEach((i) => {
      const b = document.createElement('button');
      b.type = 'button';
      let cls = 'sitem';
      if (i.missing) cls += ' missing';
      if (i.duplicate) cls += ' duplicate';
      b.className = cls;
      if (i.flag) {
        const img = document.createElement('img');
        img.className = 'flag'; img.alt = ''; img.src = i.flag;
        img.onerror = () => { img.remove(); b.classList.remove('hasflag'); };
        b.classList.add('hasflag'); b.appendChild(img);
      }
      b.appendChild(document.createTextNode(i.label));
      b.addEventListener('click', () => onPick(i));
      listEl.appendChild(b);
    });
  listEl.classList.add('open');
}
const closeLists = () => document.querySelectorAll('.slist').forEach((l) => l.classList.remove('open'));
[
  ['sIsland', 'lIsland', 'islands', (i) => {
    pickedIsland = i;
    $('sIsland').value = i.label;
    if (i.missing) setStatus('Not on map (sheet only): ' + i.label);
    else if (i.layers && i.layers.length) showLayers(i.layers);
  }],
  ['sOrg', 'lOrg', 'orgs', (i) => { $('sOrg').value = i.label; showLayers(i.layers); }],
  ['sOwner', 'lOwner', 'owners', (i) => { $('sOwner').value = i.label; showLayers(i.layers); }]
].forEach(([inId, listId, key, pick]) => {
  const input = $(inId), list = $(listId);
  const open = (filter) => { closeLists(); fillList(list, collect()[key], filter, (i) => { pick(i); closeLists(); }); };
  input.addEventListener('focus', () => open(''));
  input.addEventListener('input', () => { if (inId === 'sIsland') pickedIsland = null; open(input.value); });
});
function zoomIsland() {
  let t = pickedIsland;
  if (!t) {
    const v = $('sIsland').value.trim();
    const all = collect().islands;
    t = all.find((i) => i.label === v) || all.find((i) => i.label.toLowerCase() === v.toLowerCase());
  }
  if (t) showLayers(t.layers); else setStatus('No island with that name.');
}
$('sZoom').addEventListener('click', zoomIsland);
$('sIsland').addEventListener('keydown', (e) => { if (e.key === 'Enter') { closeLists(); zoomIsland(); } });
const panels = ['searchFrame', 'settingsFrame'];
function togglePanel(id) { panels.forEach((p) => $(p).classList.toggle('open', p === id && !$(p).classList.contains('open'))); closeLists(); }
$('searchBtn').addEventListener('click', () => togglePanel('searchFrame'));
$('settingsBtn').addEventListener('click', () => togglePanel('settingsFrame'));
document.addEventListener('pointerdown', (e) => { if (!$('searchFrame').contains(e.target)) closeLists(); });







// ===== Island names on the map (white text, black outline; names containing "???" are never shown) =====
const labelItems = new L.FeatureGroup().addTo(map);
function rebuildLabels() {
  labelItems.clearLayers();
  if (!OPT.names || !mapWidth) return;
  drawnItems.eachLayer((l) => {
    if (l._hidden) return;
    const name = String(l.feature.properties.name || '');
    if (!name || name.includes('???')) return;
    const c = turf.pointOnFeature(l.toGeoJSON()).geometry.coordinates;
    for (let k = -WRAP_COPIES; k <= WRAP_COPIES; k++) {
      const el = document.createElement('div');
      el.textContent = name;
      L.marker([c[1], c[0] + k * mapWidth], { interactive: false, keyboard: false, icon: L.divIcon({ className: 'map-label', html: el, iconSize: [0, 0] }) }).addTo(labelItems);
    }
  });
}

// ===== Icons and settings =====
document.querySelectorAll('.ico').forEach((el) => {
  const url = ICONS[el.dataset.icon];
  if (url) { el.style.setProperty('--ico', `url("${url}")`); el.classList.add('has-img'); el.textContent = ''; }
});
$('optColors').addEventListener('change', (e) => { OPT.colors = e.target.checked; restyleAll(); });
$('optFlags').addEventListener('change', (e) => { OPT.flags = e.target.checked; rebuildFlags(); });
$('optNames').addEventListener('change', (e) => { OPT.names = e.target.checked; rebuildLabels(); });
$('optHideUnnamed').addEventListener('change', (e) => { OPT.hideUnnamed = e.target.checked; rebuildVisibility(); });
$('optHideUnowned').addEventListener('change', (e) => { OPT.hideUnowned = e.target.checked; rebuildVisibility(); });
$('optOpacity').value = POLYGON_FILL_OPACITY;
$('optOpacityVal').textContent = POLYGON_FILL_OPACITY;
$('optOpacity').addEventListener('input', (e) => {
  POLYGON_FILL_OPACITY = parseFloat(e.target.value);
  $('optOpacityVal').textContent = POLYGON_FILL_OPACITY;
  restyleAll(); // updates colors, stripes, and flags together
});
if (lowResources) { $('optFlags').checked = false; $('optFlags').title = 'Turned off automatically (data saver / low memory)'; }
</script>
