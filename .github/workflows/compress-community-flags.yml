name: Compress oversized community flags

on:
  push:
    paths:
      - "flags/**"
      - "crewflags/**"
      - "crew-flags/**"
      - "tools/compress_flag_images.py"
      - ".github/workflows/compress-community-flags.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compress-community-flags
  cancel-in-progress: false

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image support
        run: python -m pip install --upgrade Pillow

      - name: Compress images over 950 KB
        run: python tools/compress_flag_images.py

      - name: Save optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flags crewflags crew-flags
          if ! git diff --cached --quiet; then
            git commit -m "Automatically compress oversized community flags [skip ci]"
            git push
          else
            echo "No oversized images needed compression."
          fi
