name: Update island data

on:
  push:                    # runs whenever you update the repo
    paths-ignore:          # ...but not when only the generated files changed
      - 'island-colors.tsv'
      - 'island-groups.tsv'
      - 'island-flags.png'
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (picks up Google Sheets changes)
  workflow_dispatch:       # lets you press "Run workflow" by hand

concurrency:
  group: island-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tools
        run: |
          npm init -y
          npm install playwright sharp
          npx playwright install --with-deps chromium

      - name: Build island data
        env:
          PAGE_PATH: debugging/index.html   # the debug page that has the export code (change if yours is named differently)
        run: node tools/build-island-data.js

      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add island-colors.tsv island-flags.png island-groups.tsv
          if ! git diff --cached --quiet; then
            git commit -m "Update island data"
            git pull --rebase
            git push
          fi
