name: Sync embedded loading quotes

on:
  push:
    paths:
      - "quotes.tsv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-embedded-loading-quotes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate embedded quotes
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          tsv = Path("quotes.tsv").read_text(encoding="utf-8-sig")
          quotes = []
          seen = set()

          for line in tsv.splitlines():
              fields = line.split("\t")
              if len(fields) != 11:
                  continue
              if not fields[0].strip() or not re.fullmatch(r"\d{17,20}", fields[3] or ""):
                  continue
              message_id = fields[3]
              if message_id in seen:
                  continue
              seen.add(message_id)
              quotes.append({
                  "quote": fields[0],
                  "displayName": fields[1] or "",
                  "username": fields[2] or "",
                  "messageUrl": fields[4] or "",
                  "quoteAuthorAvatar": fields[7] or "",
                  "submitterAvatar": fields[9] or "",
                  "submitterName": fields[10] or ""
              })

          if not quotes:
              raise SystemExit("No valid quotes found; refusing to replace the embedded list.")

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")
          replacement = "const EMBEDDED_QUOTES = " + json.dumps(
              quotes, ensure_ascii=False, separators=(",", ":")
          ) + ";"
          updated, count = re.subn(
              r"const EMBEDDED_QUOTES\s*=\s*\[.*?\];",
              lambda _: replacement,
              html,
              count=1,
              flags=re.DOTALL
          )
          if count != 1:
              raise SystemExit("Could not locate the embedded quote array in index.html.")
          index_path.write_text(updated, encoding="utf-8")
          print(f"Embedded {len(quotes)} unique quotes into index.html.")
          PY

      - name: Commit and push without overwriting concurrent edits
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Embedded quotes are already up to date."
            exit 0
          fi
          git commit -m "Sync embedded quotes from quotes.tsv"

          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH"; then
              if git push origin "HEAD:$BRANCH"; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict detected. Refusing to overwrite newer index.html changes."
              exit 1
            fi
            sleep 2
          done

          echo "Could not push quote sync after 5 attempts."
          exit 1
