name: Island cards and GIFs (test)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild every GIF, even unchanged ones"
        type: boolean
        default: false
  schedule:
    - cron: '45 */6 * * *'
  push:
    paths:
      - 'tools/build_island_gifs.py'
      - 'tools/build_island_cards.py'
      - '.github/workflows/island-cards-test.yml'

permissions:
  contents: write

concurrency:
  group: island-cards-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow

      - name: Get the pictures from the last run (so only changes get rebuilt/archived)
        run: |
          git clone -q --depth 1 --branch bot-images-test \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" botimg-test \
            || mkdir -p botimg-test
          rm -rf botimg-test/.git

      - name: Build island cards (PNG)
        run: python tools/build_island_cards.py

      - name: Build island GIFs
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python tools/build_island_gifs.py --force
          else
            python tools/build_island_gifs.py
          fi

      - name: Publish (saves current and archive folders)
        run: |
          cd botimg-test
          git init -q -b bot-images-test
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Island cards and GIFs (test)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" bot-images-test
