name: Convert Island Backgrounds to WebP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Convert island backgrounds
        run: python tools/convert_island_backgrounds.py
      - name: Commit converted images and manifest
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add island-backgrounds/
            git commit -m "Convert island backgrounds to WebP"
            git push
          else
            echo "All island backgrounds are already WebP."
          fi
